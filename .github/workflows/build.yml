name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_B64 secret tanımlı değil, debug anahtarı kullanılacak."
          fi

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: hesapdefteri
          KEY_ALIAS: hesap
          KEY_PASSWORD: hesapdefteri
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.3.${{ github.run_number }} --stacktrace

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hesap Defteri build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
